[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
# Pure black background regardless of theme.
background=000000
# Just below 1.0 so foot still requests blur (only does when "transparent");
# looks opaque when focused. Unfocused translucency comes from Hyprland (hypr/looknfeel.lua).
alpha=0.999
# foot must request blur itself (ext-background-effect); Hyprland honors it.
blur=yes
